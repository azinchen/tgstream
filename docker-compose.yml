# tgstream - Telegram live streams to Plex/Jellyfin (MTProto, no browser).
#
# One capture container per channel pulls the live stream directly over
# MTProto and serves it as HLS + MPEG-TS. The guide merges channels into one
# playlist / XMLTV / HDHomeRun tuner. No MediaMTX, no Chromium.
#
# To add a channel: copy the tg-main block, change slug/peer/name/number, its
# /state volume and published port, then append its URL to the guide's
# UPSTREAMS. Each channel logs in once via its own QR (docker logs).
#
# Host paths and PUBLIC_HOST come from .env (see .env.example).

x-capture: &capture
  image: ghcr.io/azinchen/tgstream:latest
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped

services:
  tg-main:
    <<: *capture
    container_name: tg-main
    environment:
      - TZ=${TZ}
      - TG_SLUG=main
      - TG_PEER=${TG_PEER}
      - TG_NAME=${TG_NAME:-Telegram Main}
      - TG_CHANNEL_NUMBER=1
      - API_ID=${API_ID}
      - API_HASH=${API_HASH}
      - PUBLIC_HOST=${PUBLIC_HOST}
      - PUBLIC_HTTP_PORT=8410     # must match the ports: mapping below
    volumes:
      - ${APPDATA_DIR}/state/main:/state
      - ${LIBRARY_DIR}:/library
    ports:
      # HLS + MPEG-TS + status + /login (scan the QR here on first start).
      # Must be reachable from Plex, Jellyfin AND playback clients.
      - "8410:8409"

  guide:
    image: ghcr.io/azinchen/tgstream-guide:latest
    build:
      context: ./guide
      dockerfile: Dockerfile
    container_name: tgstream-guide
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - UPSTREAMS=http://tg-main:8409
      # URL by which Plex reaches this guide (HDHomeRun BaseURL).
      - GUIDE_URL=http://${PUBLIC_HOST}:8409
    ports:
      # Plex/Jellyfin tuner + guide URL: http://<host>:8409/playlist.m3u
      - "8409:8409"

# To expose through an existing reverse proxy instead of host ports, attach
# the containers to the external network:
#
# networks:
#   default:
#   reverseproxynetwork:
#     external: true
