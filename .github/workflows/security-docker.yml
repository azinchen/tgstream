name: Security - Docker Image Analysis

permissions:
  contents: read
  security-events: write  # Required for uploading SARIF files to Security tab

on:
  schedule:
    - cron: '0 6 * * *'  # Run at 6 AM UTC daily to check the latest production images on GHCR
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to scan'
        required: false
        default: 'latest'
        type: string
  workflow_call:  # Allow this workflow to be called by other workflows
    inputs:
      image_tag:
        description: 'Docker image tag to scan'
        required: false
        default: 'latest'
        type: string
      is_production_build:
        description: 'Whether this is a production build (tag)'
        required: false
        default: false
        type: boolean

jobs:
  docker-security-scan:
    name: 🔍 Scan ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [ tgstream, tgstream-guide ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Determine image to scan
        id: config
        shell: bash
        run: |
          IMAGE_TAG="${{ inputs.image_tag || 'latest' }}"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            IMAGE_TAG="latest"
            echo "🕒 Scheduled scan: Checking latest production image on GHCR"
          fi
          IMAGE_REF="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_ref=${IMAGE_REF}" >> $GITHUB_OUTPUT

          echo "📋 Scan Configuration:"
          echo "  Event: ${{ github.event_name }}"
          echo "  Image Tag: ${IMAGE_TAG}"
          echo "  Full Image Reference: ${IMAGE_REF}"
          echo "  Production Build: ${{ inputs.is_production_build }}"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Run Trivy security scan
        id: trivy-image
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: "${{ steps.config.outputs.image_ref }}"
          format: 'sarif'
          output: 'trivy-image-results.sarif'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.6
        if: ${{ always() && hashFiles('trivy-image-results.sarif') != '' }}
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-docker-image-${{ matrix.image }}'

      - name: Run Grype security scan
        id: grype-scan
        continue-on-error: true
        uses: anchore/scan-action@v7.4.0
        with:
          image: "${{ steps.config.outputs.image_ref }}"
          fail-build: false
          severity-cutoff: medium
          output-format: sarif

      - name: Move Grype results to named file
        if: always()
        run: |
          if [ -f "results.sarif" ]; then
            mv results.sarif grype-results.sarif
          fi

      - name: Upload Grype scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4.37.6
        if: always() && hashFiles('grype-results.sarif') != ''
        with:
          sarif_file: 'grype-results.sarif'
          category: 'grype-docker-image-${{ matrix.image }}'
