name: CI - Build and Deploy

on:
  push:
    # Production builds: tags only -> push to GHCR + Docker Hub with latest tag
    # Development builds: main and other branches -> push branch tag to GHCR only
    branches: [ '**' ]
    tags: [ '**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  actions: read
  security-events: write  # Required for called security workflows to upload SARIF files

# Cancel superseded in-progress runs per ref. Tags (releases) are never
# cancelled so a publish in flight always completes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  # Chromium in Alpine is only built for x86_64 and aarch64, which caps the
  # capture image; the guide image follows for consistency.
  PLATFORMS: "linux/amd64,linux/arm64"
  # Fast builds for development branches (amd64 only)
  DEV_PLATFORMS: "linux/amd64"

jobs:
  build-and-deploy:
    name: 🏗️ Build and Deploy ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: tgstream
            context: .
            readme: README.md
            description: "Capture Telegram channel live streams, restream to Plex/Jellyfin as live TV and record to files"
          - name: tgstream-guide
            context: ./guide
            readme: README.md
            description: "Guide aggregator for tgstream: merges capture containers into one M3U playlist and XMLTV guide"
    outputs:
      image_tag: ${{ steps.git.outputs.image_tag }}
      is_tag: ${{ steps.git.outputs.is_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # === VALIDATION PHASE ===
      - name: Validate required secrets
        shell: bash
        run: |
          echo "🔐 Validating required secrets and environment..."

          # Docker Hub credentials are required for production builds (tags only)
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            if [[ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]] || [[ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]]; then
              echo "❌ DockerHub credentials not available for production build"
              exit 1
            fi
            if [[ -z "${{ secrets.DOCKERHUB_PASSWORD }}" ]]; then
              echo "⚠️  DockerHub password not available - repo description update will be skipped"
            fi
          fi

          echo "✅ Secret validation completed"

      # === BUILD CONFIGURATION PHASE ===
      - name: Get branch name and build metadata
        id: git
        shell: bash
        run: |
          # Determine if this is a tag or branch
          IS_TAG=${{ github.ref_type == 'tag' }}

          # Get clean branch/tag name
          if [[ "$IS_TAG" == "true" ]]; then
            # Remove 'v' prefix from tag name for production releases
            IMAGE_TAG=${GITHUB_REF_NAME#v}
            PLATFORMS="${{ env.PLATFORMS }}"
            PUSH_LATEST=true
          elif [[ "$GITHUB_REF_NAME" == "main" ]]; then
            IMAGE_TAG="dev"  # Main branch tagged as 'dev'
            PLATFORMS="${{ env.PLATFORMS }}"
            PUSH_LATEST=false
          else
            # Sanitize branch name for Docker tag
            IMAGE_TAG=$(echo "${GITHUB_REF_NAME}" | sed 's/[^a-zA-Z0-9._-]/-/g' | sed 's/^-\+\|-\+$//g')
            PLATFORMS="${{ env.DEV_PLATFORMS }}"
            PUSH_LATEST=false
          fi

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "is_tag=${IS_TAG}" >> $GITHUB_OUTPUT
          echo "platforms=${PLATFORMS}" >> $GITHUB_OUTPUT
          echo "push_latest=${PUSH_LATEST}" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%d %H:%M:%S %Z')" >> $GITHUB_OUTPUT

          echo "Action branch=${GITHUB_REF_NAME} tag=${IS_TAG} ref=${GITHUB_REF} image_tag=${IMAGE_TAG} platforms=${PLATFORMS}"

      # === AUTHENTICATION PHASE ===
      - name: Login to DockerHub
        if: ${{ steps.git.outputs.push_latest == 'true' }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # === DOCKER BUILD SETUP PHASE ===
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0
        with:
          platforms: ${{ steps.git.outputs.platforms }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      # === BUILD AND PUSH PHASE ===
      - name: Build and push image (Development)
        if: ${{ steps.git.outputs.push_latest == 'false' }}
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ steps.git.outputs.platforms }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          build-args: |
            IMAGE_VERSION=${{ steps.git.outputs.image_tag }}
            BUILD_DATE=${{ steps.git.outputs.build_date }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ steps.git.outputs.image_tag }}

      - name: Build and push image (Production)
        if: ${{ steps.git.outputs.push_latest == 'true' }}
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.image.context }}
          platforms: ${{ steps.git.outputs.platforms }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
          build-args: |
            IMAGE_VERSION=${{ steps.git.outputs.image_tag }}
            BUILD_DATE=${{ steps.git.outputs.build_date }}
          tags: |
            ${{ github.repository_owner }}/${{ matrix.image.name }}:${{ steps.git.outputs.image_tag }}
            ${{ github.repository_owner }}/${{ matrix.image.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ steps.git.outputs.image_tag }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:latest

      # === REPOSITORY MAINTENANCE PHASE ===
      - name: Update Docker Hub repo description
        if: ${{ steps.git.outputs.is_tag == 'true' }}
        uses: peter-evans/dockerhub-description@v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
          repository: ${{ github.repository_owner }}/${{ matrix.image.name }}
          short-description: ${{ matrix.image.description }}
          readme-filepath: ${{ matrix.image.readme }}

      # === MONITORING AND METADATA PHASE ===
      - name: Get image size and metadata
        if: ${{ always() }}
        shell: bash
        run: |
          echo "📊 Image Build Metrics:"
          echo "- Image: ${{ matrix.image.name }}"
          echo "- Image Tag: ${{ steps.git.outputs.image_tag }}"
          echo "- Platforms: ${{ steps.git.outputs.platforms }}"
          echo "- Registry: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ steps.git.outputs.image_tag }}"

          if docker manifest inspect ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}:${{ steps.git.outputs.image_tag }} >/dev/null 2>&1; then
            echo "✅ Image successfully pushed and available"
          else
            echo "⚠️  Image may still be propagating"
          fi

  # === SECURITY SCANNING PHASE ===
  security-scan-built-image:
    name: 🔒 Security Scan - Built Images
    needs: build-and-deploy
    # Only scan production-ish images (main + tags); feature-branch dev
    # images are throwaway and the daily cron already covers 'latest'.
    if: ${{ always() && needs.build-and-deploy.result == 'success'
            && (github.ref_name == 'main' || github.ref_type == 'tag') }}
    uses: ./.github/workflows/security-docker.yml
    with:
      image_tag: ${{ needs.build-and-deploy.outputs.image_tag }}
      is_production_build: ${{ needs.build-and-deploy.outputs.is_tag == 'true' }}
    secrets: inherit
